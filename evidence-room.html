<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Milk It Pinboard</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17130f;font-family:system-ui}.room{position:absolute;inset:0;background:radial-gradient(circle at 50% 0,#76563366,#1b1510 45%,#090807 95%)}.board{position:absolute;left:4vw;top:10vh;width:92vw;height:80vh;background:radial-gradient(circle at 40% 25%,#ad7745,#80532f 55%,#58391f);border:13px solid #2a1e14;box-shadow:0 25px 80px #000,inset 0 0 80px #261609}.bar{position:fixed;z-index:50;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#11100edd;color:#f4e4c8;border:1px solid #5e4933;border-radius:999px;padding:9px 12px;text-decoration:none;font-weight:850;font-size:13px}.card{position:absolute;z-index:10;width:150px;min-height:100px;padding:11px;background:#fff0c7;color:#211a13;box-shadow:4px 7px 13px #0008;touch-action:none;user-select:none}.a{left:7%;top:17%;transform:rotate(-3deg)}.b{left:59%;top:17%;transform:rotate(3deg)}.c{left:35%;top:58%;transform:rotate(1deg)}.d{left:6%;top:62%;background:#e6efff}svg{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}line{stroke:#b51e29;stroke-width:4;filter:drop-shadow(0 1px 1px #000)}.hint{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);color:#d1c1a9;background:#0b0a09dd;padding:8px 12px;border-radius:999px;font-size:11px;white-space:nowrap}</style></head><body><div class="room"><div class="bar"><span class="pill">📌 MERCER CASE PINBOARD</span><a class="pill" href="index.html">← Case Feed</a></div><div class="board" id="board"><svg><line id="l1"/><line id="l2"/><line id="l3"/></svg><div id="a" class="card a"><b>🚪 DOOR LOG</b><br>Rear door opened 10:52 PM.</div><div id="b" class="card b"><b>📄 INVOICE #481</b><br>“R. Cole” pickup at 10:45 PM.</div><div id="c" class="card c"><b>👂 WITNESS</b><br>Argument heard about 11:05 PM.</div><div id="d" class="card d"><b>❓ QUESTION</b><br>Who is R. Cole?</div></div><div class="hint">Drag evidence — red strings stay attached</div></div><script>const board=document.getElementById('board'),cards=[...document.querySelectorAll('.card')];let drag,dx,dy;function cen(e){let r=e.getBoundingClientRect(),b=board.getBoundingClientRect();return[r.left-b.left+r.width/2,r.top-b.top+r.height/2]}function set(l,x,y){l.setAttribute('x1',x[0]);l.setAttribute('y1',x[1]);l.setAttribute('x2',y[0]);l.setAttribute('y2',y[1])}function lines(){set(l1,cen(a),cen(b));set(l2,cen(b),cen(c));set(l3,cen(b),cen(d))}cards.forEach(e=>e.onpointerdown=q=>{drag=e;let r=e.getBoundingClientRect();dx=q.clientX-r.left;dy=q.clientY-r.top;e.setPointerCapture(q.pointerId)});onpointermove=q=>{if(!drag)return;let b=board.getBoundingClientRect();drag.style.left=q.clientX-b.left-dx+'px';drag.style.top=q.clientY-b.top-dy+'px';drag.style.transform='none';lines()};onpointerup=()=>drag=null;onresize=lines;setTimeout(lines,100)</script></body></html>
