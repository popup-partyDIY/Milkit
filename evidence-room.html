<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#17130f"><title>Milk It — Evidence Room</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#100d0a;font-family:system-ui;color:#f7ead3}.room{position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,#815e3c66,#1b1510 48%,#080706 100%)}.boardwrap{position:absolute;left:3vw;top:9vh;width:94vw;height:80vh;overflow:hidden;border:12px solid #2a1c11;box-shadow:0 25px 90px #000,inset 0 0 70px #0007}.board{position:absolute;width:140%;height:140%;left:-20%;top:-15%;transform-origin:center;background:radial-gradient(circle at 42% 30%,#ad7745,#80532f 58%,#56361e);touch-action:none}.grain{position:absolute;inset:0;opacity:.12;pointer-events:none;background-image:repeating-linear-gradient(8deg,#fff1 0 1px,transparent 1px 7px)}.bar{position:fixed;z-index:100;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px}.pill,.tool{background:#11100eee;color:#f4e4c8;border:1px solid #66503a;border-radius:999px;padding:9px 11px;text-decoration:none;font-weight:850;font-size:11px}.tools{position:fixed;z-index:100;right:10px;bottom:14px;display:flex;gap:6px}.tool{font-size:16px;padding:9px 12px}.card{position:absolute;z-index:10;width:155px;min-height:98px;padding:11px;background:#fff0c7;color:#211a13;box-shadow:4px 7px 14px #0009;touch-action:none;user-select:none;border:0;text-align:left}.card:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#b72b2b;top:5px;left:50%;box-shadow:0 2px 3px #0008}.card b{display:block;margin:7px 0 5px}.card small{color:#6b5b49}.card.photo{background:#f5f2e9;padding:8px}.fakephoto{height:70px;background:linear-gradient(145deg,#777,#302e2a);display:grid;place-items:center;color:#ddd;font-size:24px}.card.blue{background:#e5efff}.card.white{background:#f7f4ec}.a{left:17%;top:17%;transform:rotate(-3deg)}.b{left:58%;top:15%;transform:rotate(3deg)}.c{left:40%;top:51%;transform:rotate(1deg)}.d{left:13%;top:57%;transform:rotate(-2deg)}.e{left:69%;top:49%;transform:rotate(2deg)}.f{left:67%;top:75%;transform:rotate(-2deg)}svg{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;overflow:visible}line{stroke:#c41f2d;stroke-width:3;filter:drop-shadow(0 1px 1px #000);opacity:.9}.hint{position:fixed;z-index:100;bottom:15px;left:10px;color:#d7c5a9;background:#0b0a09dd;padding:8px 10px;border-radius:999px;font-size:10px}.drawer{position:fixed;z-index:150;left:10px;right:10px;bottom:-300px;background:#f9f6ef;color:#201b16;border-radius:18px 18px 0 0;padding:17px;transition:.25s;box-shadow:0 -10px 50px #0009}.drawer.show{bottom:0}.drawer h3{margin:0 0 5px}.drawer p{margin:5px 0 12px;color:#665f57;font-size:13px}.drawer button{border:0;background:#17130f;color:white;border-radius:9px;padding:9px}.addpanel{position:fixed;z-index:160;inset:0;background:#0009;display:none;place-items:center;padding:20px}.addpanel.show{display:grid}.addbox{background:white;color:#222;border-radius:18px;padding:17px;width:min(420px,100%)}.addbox input,.addbox textarea{width:100%;border:1px solid #ddd;border-radius:9px;padding:10px;margin:5px 0}.addbox textarea{min-height:80px}.addbox div{display:flex;gap:6px}.addbox button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800}.primary{background:#17130f;color:white}
</style></head><body><div class="room"><div class="bar"><span class="pill">📌 MERCER EVIDENCE ROOM · 0.5</span><a class="pill" href="index.html">← Case</a></div><div class="boardwrap"><div class="board" id="board"><div class="grain"></div><svg id="wires"><line data-a="a" data-b="b"/><line data-a="b" data-b="c"/><line data-a="b" data-b="d"/><line data-a="c" data-b="e"/><line data-a="e" data-b="f"/></svg>
<div id="a" class="card a" data-title="Rear-door log" data-text="Alarm export: rear service door opened at 10:52 PM and closed at 10:54 PM."><b>🚪 DOOR LOG</b><small>10:52 PM · confirmed</small></div>
<div id="b" class="card b" data-title="Invoice #481" data-text="Late pickup scheduled for R. Cole at 10:45 PM. Created at 4:18 PM."><b>📄 INVOICE #481</b><small>R. Cole · 10:45 PM</small></div>
<div id="c" class="card c blue" data-title="Witness statement" data-text="Witness reports hearing an argument around 11:05 PM, estimated plus or minus five minutes."><b>👂 WITNESS</b><small>Argument · ~11:05 PM</small></div>
<div id="d" class="card d white" data-title="Working question" data-text="Is the R. Cole on the pickup invoice the same person as the RAY contact in Mercer's phone? Not confirmed."><b>❓ WHO IS R. COLE?</b><small>Open question</small></div>
<div id="e" class="card e photo" data-title="Traffic camera" data-text="Dark pickup passes eastbound at 10:49 PM and westbound at 11:13 PM. Same vehicle is possible, not established."><div class="fakephoto">🚙</div><b>TRAFFIC CAM</b><small>10:49 / 11:13</small></div>
<div id="f" class="card f" data-title="Phone record" data-text="Incoming call from saved contact RAY at 10:31 PM. Duration 2 minutes 14 seconds."><b>📞 PHONE RECORD</b><small>RAY · 10:31 PM</small></div>
</div></div><div class="hint">Drag cards · tap to inspect</div><div class="tools"><button class="tool" onclick="zoom(-.1)">−</button><button class="tool" onclick="resetBoard()">⌂</button><button class="tool" onclick="zoom(.1)">＋</button><button class="tool" onclick="addPanel.classList.add('show')">＋📌</button></div>
<div id="drawer" class="drawer"><h3 id="dt"></h3><p id="dp"></p><button onclick="drawer.classList.remove('show')">Close</button></div>
<div id="addPanel" class="addpanel"><div class="addbox"><h3>Pin new evidence</h3><input id="newTitle" placeholder="Evidence title"><textarea id="newText" placeholder="What does it show?"></textarea><div><button onclick="addPanel.classList.remove('show')">Cancel</button><button class="primary" onclick="addCard()">Pin it</button></div></div></div></div>
<script>
const board=document.getElementById('board'),cards=()=>[...document.querySelectorAll('.card')];let drag=null,dx=0,dy=0,moved=false,scale=1;
function center(e){let r=e.getBoundingClientRect(),b=board.getBoundingClientRect();return[(r.left-b.left+r.width/2)/scale,(r.top-b.top+r.height/2)/scale]}
function lines(){document.querySelectorAll('line').forEach(l=>{let a=document.getElementById(l.dataset.a),b=document.getElementById(l.dataset.b);if(!a||!b)return;let x=center(a),y=center(b);['x1','y1','x2','y2'].forEach((k,i)=>l.setAttribute(k,[x[0],x[1],y[0],y[1]][i]))})}
function bind(e){e.onpointerdown=q=>{drag=e;moved=false;let r=e.getBoundingClientRect();dx=(q.clientX-r.left)/scale;dy=(q.clientY-r.top)/scale;e.setPointerCapture(q.pointerId);e.style.zIndex=30};e.onpointerup=q=>{if(!moved)inspect(e);e.style.zIndex=10;drag=null}}
cards().forEach(bind);
onpointermove=q=>{if(!drag)return;moved=true;let b=board.getBoundingClientRect();drag.style.left=(q.clientX-b.left)/scale-dx+'px';drag.style.top=(q.clientY-b.top)/scale-dy+'px';drag.style.transform='none';lines()}
function inspect(e){dt.textContent=e.dataset.title||e.querySelector('b')?.textContent;dp.textContent=e.dataset.text||'Pinned evidence';drawer.classList.add('show')}
function zoom(d){scale=Math.max(.65,Math.min(1.55,scale+d));board.style.transform='scale('+scale+')';setTimeout(lines,20)}
function resetBoard(){scale=1;board.style.transform='scale(1)';board.style.left='-20%';board.style.top='-15%';setTimeout(lines,20)}
function addCard(){let title=newTitle.value.trim(),txt=newText.value.trim();if(!title)return;let e=document.createElement('div');e.className='card white';e.style.left=(25+Math.random()*35)+'%';e.style.top=(25+Math.random()*35)+'%';e.dataset.title=title;e.dataset.text=txt;e.innerHTML='<b>📌 '+title.replace(/[<>]/g,'')+'</b><small>Added by @tester</small>';board.append(e);bind(e);newTitle.value='';newText.value='';addPanel.classList.remove('show');inspect(e)}
onresize=lines;setTimeout(lines,120);
</script></body></html>
