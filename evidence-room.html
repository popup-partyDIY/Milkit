<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Milk It Evidence Room</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080706;font-family:system-ui}.scene{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,#5a40235c,#15100b 42%,#050505 90%)}.board{position:absolute;left:4vw;top:10vh;width:92vw;height:80vh;background:radial-gradient(circle at 40% 25%,#ad7745,#80532f 55%,#58391f);border:13px solid #2a1e14;box-shadow:0 25px 80px #000,inset 0 0 80px #261609}.bar{position:fixed;z-index:50;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#11100edc;color:#f4e4c8;border:1px solid #5e4933;border-radius:999px;padding:9px 12px;text-decoration:none;font-weight:850;font-size:13px}.card{position:absolute;z-index:10;width:155px;min-height:105px;padding:12px;background:#eee1bd;color:#211a13;box-shadow:4px 7px 13px #0008;touch-action:none;user-select:none}.a{left:8%;top:18%;transform:rotate(-3deg)}.b{left:58%;top:18%;transform:rotate(2deg)}.c{left:35%;top:59%;transform:rotate(1deg)}svg{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}line{stroke:#b51e29;stroke-width:4;filter:drop-shadow(0 1px 1px #000)}.hint{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);color:#d1c1a9;background:#0b0a09dd;padding:8px 12px;border-radius:999px;font-size:11px;white-space:nowrap}</style></head><body><div class="scene"><div class="bar"><span class="pill">📌 EVIDENCE ROOM</span><a class="pill" href="index.html">← Feed</a></div><div class="board" id="board"><svg><line id="l1"/><line id="l2"/></svg><div id="a" class="card a"><b>📷 ORIGINAL PHOTO</b><br>Unknown storefront with partial “MOTORS” sign.</div><div id="b" class="card b"><b>📰 1981 AD</b><br>Henderson Motors logo candidate.</div><div id="c" class="card c"><b>🚗 DATE CLUE</b><br>Possible 1977–79 Ford LTD II.</div></div><div class="hint">Drag the evidence — strings stay connected</div></div><script>const board=document.getElementById('board'),cards=[...document.querySelectorAll('.card')];let drag,dx,dy;function cen(e){let r=e.getBoundingClientRect(),b=board.getBoundingClientRect();return[r.left-b.left+r.width/2,r.top-b.top+r.height/2]}function lines(){let A=cen(a),B=cen(b),C=cen(c);[[l1,A,B],[l2,B,C]].forEach(x=>{x[0].setAttribute('x1',x[1][0]);x[0].setAttribute('y1',x[1][1]);x[0].setAttribute('x2',x[2][0]);x[0].setAttribute('y2',x[2][1])})}cards.forEach(e=>e.onpointerdown=q=>{drag=e;let r=e.getBoundingClientRect();dx=q.clientX-r.left;dy=q.clientY-r.top;e.setPointerCapture(q.pointerId)});onpointermove=q=>{if(!drag)return;let b=board.getBoundingClientRect();drag.style.left=q.clientX-b.left-dx+'px';drag.style.top=q.clientY-b.top-dy+'px';drag.style.transform='none';lines()};onpointerup=()=>drag=null;onresize=lines;setTimeout(lines,100)</script></body></html>
